[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "Self-hosted AI capability layer: MCP memory, code graph, web access and model gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "memory", "llm", "gateway", "code-graph", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.0",
    "pathspec>=0.12.0",
    "PyYAML>=6.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    # Graph parsers pin their own grammars; none ship in the language pack.
    "tree-sitter-swift>=0.7.4,<0.8",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-kotlin>=1.1,<2",
]

[project.optional-dependencies]
# Model proxy only (aiohttp plus upstream br/zstd decompression)
proxy = [
    "aiohttp>=3.10.0",
    "Brotli>=1.2",
    "backports.zstd",
]
# Vector memory: the heavy wheels (onnx runtime, qdrant client)
memory = [
    "mem0ai>=2.0,<3.0",
    "fastembed>=0.8.0",
    "numpy>=1.24.0",
    "qdrant-client>=1.13.0",
]
# MCP server and the HTTP layer it runs on
# mcp 2.x replaced the lowlevel decorators; server.py still registers tools
# with @server.list_tools()/@server.call_tool(), so an unbounded range breaks
# startup on any fresh install.
server = [
    "mcp>=1.6.0,<2",
    "uvicorn>=0.34.0",
    "starlette>=0.46.0",
    "anyio>=4.0",
    "trafilatura>=2.3",
]

[project.scripts]
agent-gateway = "agent_gateway.cli.minod:main"

[project.urls]
Homepage = "https://github.com/yuanyxh/agent-gateway"
Repository = "https://github.com/yuanyxh/agent-gateway"
Issues = "https://github.com/yuanyxh/agent-gateway/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]
exclude = [
    "**/__pycache__",
    "src/agent_gateway/scanner/ast-js/node_modules",
]
