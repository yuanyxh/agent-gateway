[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "AI capability layer: MCP memory, LLM gateway and desktop services"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pathspec>=0.12.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Model proxy only (aiohttp plus upstream br/zstd decompression)
proxy = [
    "aiohttp>=3.10.0",
    "Brotli>=1.2",
    "backports.zstd",
]
# Vector memory: the heavy wheels (onnx runtime, qdrant client)
memory = [
    "mem0ai>=2.0,<3.0",
    "fastembed>=0.8.0",
    "numpy>=1.24.0",
    "qdrant-client>=1.13.0",
]
# MCP server and the HTTP layer it runs on
server = [
    "mcp>=1.6.0",
    "uvicorn>=0.34.0",
    "starlette>=0.46.0",
    "anyio>=4.0",
    "trafilatura>=2.3",
]

[project.scripts]
agent-gateway = "agent_gateway.cli.minod:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]
exclude = [
    "**/__pycache__",
    "src/agent_gateway/scanner/ast-js/node_modules",
]
